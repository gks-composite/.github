name: Docker Build and Push

# ============================================================================
# Uniform Docker build/scan/tag/push pipeline for the GateKeeper enterprise.
#
#   version  -> gks-composite/global-version (falls back to 0.1.<run_number>)
#   secrets  -> gitleaks scan of the checkout (diff-scoped on PRs, tree scan
#               on pushes); fails on findings at EVERY tier. Allowlist test
#               fixtures via a repo-root .gitleaks.toml.
#   img scan -> grype vulnerability scan of the built image, RELEASE TIER ONLY
#               (default branch / tags), fail on HIGH+CRITICAL. PRs get no
#               image scan - that is deliberate (DEVO-223): keep PRs fast.
#   push     -> multi-tag push to GHCR (PRs push pr-<n>/sha- tags too).
#               Version-family tags (<version>, <major.minor>, <major>) apply
#               ONLY on release-tier builds with apply-version-tags=true, so a
#               PR/dev/dispatch build can never mint or move a version tag.
#   harden   -> SBOM + provenance (+ optional cosign) on default-branch / tags
#
# Trivy was removed 2026-10 (DEVO-223): slow DB pulls + full-context scans on
# every PR. Dependency-level vulns are covered by NuGet/npm audit in the build
# workflows and Dependabot alerts at the repo level.
#
# Auth: the built-in GITHUB_TOKEN only (no PATs). The calling job must grant
# `packages: write`, and the repo must be granted access to the image package it
# pushes and to any internal dependency packages it restores. There is no token
# fallback on purpose -> the build fails loudly if package access is missing.
# ============================================================================

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Image name (published under <registry>/<namespace>/<image-name>).'
        required: true
        type: string
      context:
        description: 'Docker build context.'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Dockerfile path relative to the build context.'
        required: false
        type: string
        default: 'Dockerfile'
      target:
        description: 'Optional build stage target.'
        required: false
        type: string
        default: ''
      platforms:
        description: 'Comma-separated build platforms for the pushed image.'
        required: false
        type: string
        default: 'linux/amd64'
      version:
        description: 'Explicit version for tagging. Empty = compute via gks-composite/global-version.'
        required: false
        type: string
        default: ''
      build-args:
        description: 'Newline-separated build args (KEY=value).'
        required: false
        type: string
        default: ''
      registry:
        description: 'Container registry host.'
        required: false
        type: string
        default: 'ghcr.io'
      image-namespace:
        description: 'Registry namespace. Defaults to the repository owner (always lowercased).'
        required: false
        type: string
        default: ''
      push:
        description: 'Push the image. Set false to build + scan only.'
        required: false
        type: boolean
        default: true
      fs-scan:
        description: 'Run a gitleaks secrets scan of the checkout (diff-scoped on PRs, tree scan on pushes).'
        required: false
        type: boolean
        default: true
      image-scan:
        description: 'Run a grype vulnerability scan of the built image on release-tier builds (default branch / tags). PRs are never image-scanned.'
        required: false
        type: boolean
        default: true
      scan-ignore-unfixed:
        description: 'Only fail the image scan on vulnerabilities that have a fix available (grype only-fixed).'
        required: false
        type: boolean
        default: false
      apply-version-tags:
        description: >-
          Apply the <version>, <major.minor> and <major> tags. Only honored on
          release-tier builds; callers that reserve the git tag first (App-Pipeline)
          pass the reservation result here so an unreserved build can never move a
          version tag.
        required: false
        type: boolean
        default: true
      sbom:
        description: 'Attach SBOM + provenance on release-tier pushes (default branch / tags).'
        required: false
        type: boolean
        default: true
      sign:
        description: 'Cosign keyless-sign the image on release-tier pushes.'
        required: false
        type: boolean
        default: false
      environment-tag:
        description: 'Optional extra raw tag (e.g. latest-qa) for promotion.'
        required: false
        type: string
        default: ''
      default-branch:
        description: 'Branch treated as trunk (versioning + latest tag + hardening).'
        required: false
        type: string
        default: 'main'
      release-branch-prefix:
        description: 'Branch prefix also treated as release tier (image scan + version tags), e.g. licenseserver release/v8.4.1. Empty disables.'
        required: false
        type: string
        default: 'release/'
      runs-on:
        description: 'Runner label.'
        required: false
        type: string
        default: 'ubuntu-latest'
      fetch-depth:
        description: 'Checkout fetch depth (0 = full history, needed for versioning).'
        required: false
        type: number
        default: 0
    outputs:
      version:
        description: 'Resolved version used for tagging.'
        value: ${{ jobs.build.outputs.version }}
      image:
        description: 'Fully-qualified image reference (without tag).'
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: 'Pushed image digest (empty when not pushed).'
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push ${{ inputs.image-name }}
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.image.outputs.ref }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      # ----- Version -----
      - name: Compute version
        id: gv
        if: ${{ inputs.version == '' }}
        continue-on-error: true
        uses: gks-composite/global-version@main
        with:
          tagPrefix: v
          defaultBranch: ${{ inputs.default-branch }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"; SRC="input"
          elif [ "${{ steps.gv.outcome }}" = "success" ] && [ -n "${{ steps.gv.outputs.version }}" ]; then
            V="${{ steps.gv.outputs.version }}"; SRC="global-version"
          else
            V="0.1.${{ github.run_number }}"; SRC="fallback"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V (source: $SRC)"

      - name: Compute image reference
        id: image
        shell: bash
        run: |
          set -euo pipefail
          NS='${{ inputs.image-namespace }}'
          [ -z "$NS" ] && NS='${{ github.repository_owner }}'
          REF=$(printf '%s/%s/%s' '${{ inputs.registry }}' "$NS" '${{ inputs.image-name }}' | tr '[:upper:]' '[:lower:]')
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Image: $REF"

      # ----- Tier policy -----
      # Release tier = push to the default branch, a release/* branch, or a tag.
      # (release/* was previously NOT release tier here, while the callers'
      # header comments claimed it was - fixed as part of DEVO-223.)
      - name: Determine release tier
        id: policy
        shell: bash
        run: |
          set -euo pipefail
          RELEASE=false
          if [ "${{ github.ref }}" = "refs/heads/${{ inputs.default-branch }}" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            RELEASE=true
          elif [ -n "${{ inputs.release-branch-prefix }}" ] && [[ "${{ github.ref }}" == "refs/heads/${{ inputs.release-branch-prefix }}"* ]]; then
            RELEASE=true
          fi
          VERSION_TAGS=false
          if [ "$RELEASE" = "true" ] && [ "${{ inputs.apply-version-tags }}" = "true" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            VERSION_TAGS=true
          fi
          echo "release_tier=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "version_tags=$VERSION_TAGS" >> "$GITHUB_OUTPUT"
          echo "Tier: release_tier=$RELEASE version_tags=$VERSION_TAGS"

      # ----- Secrets scan (gitleaks; replaced the Trivy fs scan, DEVO-223) -----
      - name: Install gitleaks
        if: ${{ inputs.fs-scan }}
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks

      # Findings are written to the job summary (visible from the PR's checks)
      # rather than uploaded as SARIF: code scanning needs GitHub Advanced
      # Security, which these private repos deliberately do not use. Every
      # control in this pipeline is free/OSS and reports into the summary.
      - name: Secrets scan (gitleaks)
        if: ${{ inputs.fs-scan }}
        shell: bash
        run: |
          set -uo pipefail
          # Diff-scoped on PRs (checkout is fetch-depth 0 by default so the base
          # exists; shallow checkouts fall back to a tree scan). Tree scan on
          # pushes/dispatch. Findings fail the job at EVERY tier - allowlist
          # test fixtures via a repo-root .gitleaks.toml, never by disabling.
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && git cat-file -e "${{ github.event.pull_request.base.sha }}^{commit}" 2>/dev/null; then
            SCOPE="PR diff (${{ github.event.pull_request.base.sha }}..HEAD)"
            /tmp/gitleaks git . \
              --log-opts="${{ github.event.pull_request.base.sha }}..HEAD" \
              --redact --no-banner --report-format json --report-path /tmp/gitleaks.json
          else
            SCOPE="working tree"
            /tmp/gitleaks dir . \
              --redact --no-banner --report-format json --report-path /tmp/gitleaks.json
          fi
          RC=$?

          # --redact masks the matched value, so only rule + location are shown.
          COUNT=$(jq 'length' /tmp/gitleaks.json 2>/dev/null || echo 0)
          {
            echo "### Secrets scan (gitleaks)"
            echo ""
            echo "Scope: ${SCOPE} · findings: **${COUNT}**"
            if [ "${COUNT}" != "0" ]; then
              echo ""
              echo "| Rule | Location |"
              echo "|---|---|"
              jq -r '.[] | "| \(.RuleID) | `\(.File):\(.StartLine)` |"' /tmp/gitleaks.json | head -50
              echo ""
              echo "Values are redacted. If these are test fixtures or documented"
              echo "local-dev defaults, allowlist the paths in a repo-root"
              echo '`.gitleaks.toml` with the reason inline — do not disable the scan.'
            else
              echo ""
              echo "No secrets detected."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit $RC

      # ----- Build tooling -----
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ inputs.registry }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' && steps.policy.outputs.version_tags == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' && steps.policy.outputs.version_tags == 'true' }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' && steps.policy.outputs.version_tags == 'true' }}
            type=raw,value=${{ inputs.environment-tag }},enable=${{ inputs.environment-tag != '' }}

      # ----- Release-tier image build (loaded) + grype scan (replaced Trivy, DEVO-223) -----
      # Runs BEFORE the push so latest/<version> can never point at an image that
      # failed its scan. PRs skip both steps entirely - the push step below still
      # builds from the same gha cache, so PRs lose only the scan time.
      - name: Build image for release scan
        id: build
        if: ${{ inputs.image-scan && steps.policy.outputs.release_tier == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          load: true
          push: false
          tags: local-scan:${{ github.run_id }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=${{ inputs.image-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image-name }}

      # fail-build is false on purpose: the gate is applied in the next step so
      # the findings reach the job summary on a FAILING run too. Severity policy
      # is unchanged - HIGH and CRITICAL fail.
      - name: Grype image scan
        id: grype
        if: ${{ inputs.image-scan && steps.policy.outputs.release_tier == 'true' }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: local-scan:${{ github.run_id }}
          fail-build: false
          severity-cutoff: high
          only-fixed: ${{ inputs.scan-ignore-unfixed }}
          output-format: json
          cache-db: true

      - name: Report image vulnerabilities
        if: ${{ inputs.image-scan && steps.policy.outputs.release_tier == 'true' }}
        shell: bash
        run: |
          set -uo pipefail
          REPORT='${{ steps.grype.outputs.json }}'
          if [ -z "$REPORT" ] || [ ! -f "$REPORT" ]; then
            echo "::warning title=grype::No scan report produced; not gating on it."
            echo "### Image vulnerabilities (grype)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Scan produced no report — not gated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BLOCKING=$(jq '[.matches[]? | select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")] | length' "$REPORT")
          TOTAL=$(jq '[.matches[]?] | length' "$REPORT")
          {
            echo "### Image vulnerabilities (grype)"
            echo ""
            echo "Image: \`${{ inputs.image-name }}\` · matches: **${TOTAL}** · High+Critical: **${BLOCKING}**"
            if [ "${BLOCKING}" != "0" ]; then
              echo ""
              echo "| Severity | Package | Version | Fix | ID |"
              echo "|---|---|---|---|---|"
              jq -r '[.matches[]? | select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")]
                     | sort_by(.vulnerability.severity)
                     | .[]
                     | "| \(.vulnerability.severity) | \(.artifact.name) | \(.artifact.version) | \(.vulnerability.fix.versions // [] | join(", ") | if . == "" then "none" else . end) | \(.vulnerability.id) |"' \
                "$REPORT" | head -50
            else
              echo ""
              echo "No High or Critical findings."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${BLOCKING}" != "0" ]; then
            echo "::error title=grype::${BLOCKING} High/Critical vulnerabilities in the built image; see the job summary."
            exit 1
          fi

      # ----- Push (real platforms, hardened on release tier) -----
      - name: Build & push image
        id: push
        if: ${{ inputs.push }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=${{ inputs.image-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image-name }}
          sbom: ${{ inputs.sbom && steps.policy.outputs.release_tier == 'true' }}
          provenance: ${{ inputs.sbom && steps.policy.outputs.release_tier == 'true' }}

      # ----- Sign (release tier, opt-in) -----
      - name: Install cosign
        if: ${{ inputs.sign && inputs.push && steps.policy.outputs.release_tier == 'true' && steps.push.outputs.digest != '' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image (keyless)
        if: ${{ inputs.sign && inputs.push && steps.policy.outputs.release_tier == 'true' && steps.push.outputs.digest != '' }}
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # ----- Summary -----
      - name: Summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Docker image: \`${{ inputs.image-name }}\`"
            echo ""
            echo "- **Image**: \`${{ steps.image.outputs.ref }}\`"
            echo "- **Version**: \`${{ steps.version.outputs.version }}\`"
            echo "- **Pushed**: \`${{ inputs.push }}\`  •  **Digest**: \`${{ steps.push.outputs.digest || 'n/a' }}\`"
            echo "- **Release tier**: \`${{ steps.policy.outputs.release_tier }}\`  •  **Version tags applied**: \`${{ steps.policy.outputs.version_tags }}\`"
            echo "- **Secrets scan (gitleaks)**: \`${{ inputs.fs-scan }}\`  •  **Image scan (grype, release tier only)**: \`${{ inputs.image-scan && steps.policy.outputs.release_tier == 'true' }}\`"
            echo "- **Hardened (SBOM/provenance)**: \`${{ inputs.sbom && steps.policy.outputs.release_tier == 'true' }}\`"
            echo ""
            echo "### Tags"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
