name: Build, Test and Deploy

# Thin caller for the standard FaceFirst app pipeline (DEVO-223):
# version -> reserve tag -> build/test -> image build+scan+push -> GitHub
# release -> sbx deploy dispatch. Pipeline changes happen in
# gks-composite/.github, not here.

on:
  workflow_dispatch:
    inputs:
      environment_tag:
        description: 'Optional promotion tag to also apply (e.g. latest-qa)'
        required: false
        type: string
  push:
    branches:
      - $default-branch
      - 'release/**'
  pull_request:
    branches:
      - $default-branch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write   # reserve tag + release
  packages: write   # GHCR push

jobs:
  pipeline:
    # On the job, all of them: GitHub checks every App-Pipeline job's
    # permissions when the run starts, opt-in jobs included, and rejects the
    # whole run if one asks for more than this grants.
    permissions:
      contents: write       # reserve the version tag + create the release
      packages: write       # GHCR push (implies the read NuGet restore needs)
      id-token: write       # SBOM / provenance attestations
      actions: read         # code-quality (opt-in): the baseline artifact lookup
      pull-requests: write  # code-quality (opt-in): its PR comment
    uses: gks-composite/.github/.github/workflows/App-Pipeline.yml@main
    secrets: inherit
    with:
      # build-target: '.'
      # test-projects: |
      #   My.App.Tests/My.App.Tests.csproj
      images: '[{"name":"my-image","dockerfile":"Dockerfile"}]'
      environment-tag: ${{ github.event.inputs.environment_tag || '' }}
      # deploy-sbx: true
      # deploy-app-key: 'identity'   # ff:apps key in ff-cloud-services
      # Opt-in code quality: needs a source-check job in this workflow (see
      # gks-composite/code-quality's README).
      # code-quality-languages: ${{ needs.source-check.outputs.languages }}
