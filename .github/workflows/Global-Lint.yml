name: Generic Global Linter

# ============================================================================
# DEPRECATED (DEVO-223): super-linter has been retired enterprise-wide - it was
# slow, ran with DISABLE_ERRORS=true (so it gated nothing), and its auto-commit
# of prettier fixes self-invalidated PR approvals under rulesets that require
# last-push approval.
#
# The call contract (branch input, OVERRIDE_TOKEN secret) is preserved so
# existing callers stay green; the job now emits a deprecation notice and
# succeeds. Remove the call from your workflow - repo-local linting belongs in
# the repo's own toolchain (dotnet format, eslint, ruff, ...), where it can
# actually fail the build.
# ============================================================================

on:
  workflow_call:
    inputs:
      branch:
        description: 'Which branch is the default'
        required: false
        type: string
        default: ""
    secrets:
      OVERRIDE_TOKEN:
        required: false

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Deprecation notice
        run: |
          echo "::warning title=Global-Lint is deprecated::super-linter was retired (DEVO-223). This call is a no-op - remove it from the calling workflow and lint with the repo's own toolchain instead."
          {
            echo "## Global-Lint is deprecated (DEVO-223)"
            echo ""
            echo "super-linter was retired enterprise-wide: it ran with \`DISABLE_ERRORS: true\` (gating nothing),"
            echo "was slow, and its lint-fix auto-commits invalidated PR approvals."
            echo ""
            echo "**Action:** remove the \`Global-Lint.yml\` call from this repo's workflow."
          } >> "$GITHUB_STEP_SUMMARY"
