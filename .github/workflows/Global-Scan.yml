name: Generic Global Scanner

# ============================================================================
# DEVO-223: Trivy removed enterprise-wide (slow DB pulls, heavy full-context
# scans). This workflow keeps its call contract (working_dir, OVERRIDE_TOKEN)
# but now runs a gitleaks SECRETS scan instead of the Trivy fs scan.
#
# It stays REPORT-ONLY by default to preserve existing callers' behavior (the
# Trivy step always ran with exit-code 0). Pass fail-on-findings: true to make
# leaked secrets fail the build - recommended once a repo has a .gitleaks.toml
# allowlist for its test fixtures.
#
# Dependency/image vulnerability coverage moved to NuGet/npm audit in the build
# pipelines, grype in Docker-Build-Push (release tier), and Dependabot alerts.
# ============================================================================

on:
  workflow_call:
    inputs:
      working_dir:
        description: 'directory should be scanned'
        required: false
        type: string
        default: "."
      fail-on-findings:
        description: 'Fail the job when gitleaks finds secrets (default false preserves the old report-only behavior).'
        required: false
        type: boolean
        default: false
    secrets:
      OVERRIDE_TOKEN:
        required: false
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      statuses: write
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          token: ${{ secrets.OVERRIDE_TOKEN || secrets.GITHUB_TOKEN }}
          submodules: recursive
          persist-credentials: false

      - name: Install gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks

      # Findings go to the job summary. SARIF / code scanning is not used: it
      # needs GitHub Advanced Security, which these private repos deliberately
      # do not use - every control is free/OSS and reports into the summary.
      - name: Secrets scan (gitleaks)
        shell: bash
        working-directory: ${{ inputs.working_dir }}
        run: |
          set -euo pipefail
          # -e is on: GitHub runs bash as `bash -eo pipefail` whatever this line says.
          # Exits that are EXPECTED to be non-zero are captured with `|| RC=$?`, and
          # truncation uses awk rather than head, so an early-closing reader cannot
          # SIGPIPE the producer under pipefail.
          RC=0
          /tmp/gitleaks dir . --redact --no-banner \
            --report-format json --report-path /tmp/gitleaks.json || RC=$?

          # --redact masks the matched value, so only rule + location are shown.
          COUNT=$(jq 'length' /tmp/gitleaks.json 2>/dev/null || echo 0)
          {
            echo "### Secrets scan (gitleaks)"
            echo ""
            echo "Scanned: \`${{ inputs.working_dir }}\` · findings: **${COUNT}**"
            if [ "${COUNT}" != "0" ]; then
              echo ""
              echo "| Rule | Location |"
              echo "|---|---|"
              jq -r '.[] | "| \(.RuleID) | `\(.File):\(.StartLine)` |"' /tmp/gitleaks.json | awk 'NR<=50'
              echo ""
              echo 'Values are redacted. Allowlist test fixtures and documented'
              echo 'local-dev defaults in a repo-root `.gitleaks.toml`.'
            else
              echo ""
              echo "No secrets detected."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # gitleaks exits 1 for findings and 2+ for its own errors. report-only
          # mode downgrades FINDINGS to a warning - it must never downgrade a
          # scanner crash, or a repo with leaked secrets stays green because the
          # scan never ran.
          if [ "$RC" != "0" ] && [ "$RC" != "1" ]; then
            echo "::error title=gitleaks::Scanner failed (exit ${RC}) - the scan did not complete, so this is not a clean result."
            exit "$RC"
          fi
          if [ "$RC" = "1" ] && [ "${{ inputs.fail-on-findings }}" != "true" ]; then
            echo "::warning title=gitleaks::${COUNT} potential secret(s) found (report-only; pass fail-on-findings: true to enforce). See the job summary."
            exit 0
          fi
          exit $RC
