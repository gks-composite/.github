name: 'Trivy Scan'
author: 'AR-FF'
description: 'Org-owned wrapper around Trivy for filesystem, container image and IaC/config scanning with severity gating.'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  scan-type:
    description: 'Trivy scan type: fs | image | config | repo'
    required: false
    default: 'fs'
  scan-ref:
    description: 'Scan target. A path for fs/config/repo scans, or a fully-qualified image reference for image scans.'
    required: false
    default: '.'
  severity:
    description: 'Comma-separated severities to report on and gate against (e.g. HIGH,CRITICAL).'
    required: false
    default: 'HIGH,CRITICAL'
  exit-code:
    description: 'Exit code when a finding of the given severity is present. 0 = report only, 1 = fail the step.'
    required: false
    default: '0'
  ignore-unfixed:
    description: 'Ignore vulnerabilities that do not yet have a fix available.'
    required: false
    default: 'false'
  scanners:
    description: 'Comma-separated Trivy scanners to enable (vuln,secret,misconfig,license).'
    required: false
    default: 'vuln,secret'
  format:
    description: 'Trivy output format (table, sarif, json, cyclonedx, ...).'
    required: false
    default: 'table'
  output:
    description: 'Optional output file (e.g. trivy-results.sarif). Empty writes the table to the log.'
    required: false
    default: ''
  trivyignores:
    description: 'Comma-separated list of .trivyignore file paths.'
    required: false
    default: ''
  working-dir:
    description: 'Back-compat alias. When set for an fs/config scan it overrides scan-ref with this directory.'
    required: false
    default: ''
  summary:
    description: 'Append a short summary line to the GitHub step summary.'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Resolve scan target
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        SCAN_TYPE='${{ inputs.scan-type }}'
        REF='${{ inputs.scan-ref }}'
        WD='${{ inputs.working-dir }}'

        # working-dir is a back-compat alias for callers migrating off the legacy scanner.
        if [ -n "$WD" ] && { [ "$SCAN_TYPE" = "fs" ] || [ "$SCAN_TYPE" = "config" ] || [ "$SCAN_TYPE" = "repo" ]; }; then
          REF="$WD"
        fi

        if [ "$SCAN_TYPE" = "image" ]; then
          echo "scan_ref=" >> "$GITHUB_OUTPUT"
          echo "image_ref=$REF" >> "$GITHUB_OUTPUT"
        else
          echo "scan_ref=$REF" >> "$GITHUB_OUTPUT"
          echo "image_ref=" >> "$GITHUB_OUTPUT"
        fi
        echo "Trivy $SCAN_TYPE scan of '$REF' (severity=${{ inputs.severity }}, exit-code=${{ inputs.exit-code }})"

    - name: Run Trivy
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: ${{ inputs.scan-type }}
        scan-ref: ${{ steps.resolve.outputs.scan_ref }}
        image-ref: ${{ steps.resolve.outputs.image_ref }}
        severity: ${{ inputs.severity }}
        exit-code: ${{ inputs.exit-code }}
        ignore-unfixed: ${{ inputs.ignore-unfixed }}
        scanners: ${{ inputs.scanners }}
        format: ${{ inputs.format }}
        output: ${{ inputs.output }}
        trivyignores: ${{ inputs.trivyignores }}

    - name: Step summary
      if: ${{ always() && inputs.summary == 'true' }}
      shell: bash
      run: |
        {
          echo "### Trivy ${{ inputs.scan-type }} scan — ${{ job.status }}";
          echo "";
          echo "- Target: \`${{ inputs.scan-ref }}\`";
          echo "- Severity gate: \`${{ inputs.severity }}\` (exit-code \`${{ inputs.exit-code }}\`)";
          echo "- Scanners: \`${{ inputs.scanners }}\`";
        } >> "$GITHUB_STEP_SUMMARY"
