name: Docker Build and Push

# ============================================================================
# Uniform Docker build/scan/tag/push pipeline for the GateKeeper enterprise.
#
#   version  -> gks-composite/global-version (falls back to 0.1.<run_number>)
#   fs scan  -> Trivy filesystem scan of the build context (source + deps)
#   build    -> single-arch load for scanning
#   img scan -> Trivy image scan of the built image
#   push     -> multi-tag push to GHCR (PRs push pr-<n>/sha- tags too)
#   harden   -> SBOM + provenance (+ optional cosign) on default-branch / tags
#
# Tiered scan gating:
#   pull_request                 -> fail on CRITICAL
#   default branch / release tag -> fail on HIGH,CRITICAL   (hardened release)
#   other branches               -> report only
#
# Auth: the built-in GITHUB_TOKEN only (no PATs). The calling job must grant
# `packages: write`, and the repo must be granted access to the image package it
# pushes and to any internal dependency packages it restores. There is no token
# fallback on purpose -> the build fails loudly if package access is missing.
# ============================================================================

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Image name (published under <registry>/<namespace>/<image-name>).'
        required: true
        type: string
      context:
        description: 'Docker build context.'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Dockerfile path relative to the build context.'
        required: false
        type: string
        default: 'Dockerfile'
      target:
        description: 'Optional build stage target.'
        required: false
        type: string
        default: ''
      platforms:
        description: 'Comma-separated build platforms for the pushed image.'
        required: false
        type: string
        default: 'linux/amd64'
      version:
        description: 'Explicit version for tagging. Empty = compute via gks-composite/global-version.'
        required: false
        type: string
        default: ''
      build-args:
        description: 'Newline-separated build args (KEY=value).'
        required: false
        type: string
        default: ''
      registry:
        description: 'Container registry host.'
        required: false
        type: string
        default: 'ghcr.io'
      image-namespace:
        description: 'Registry namespace. Defaults to the repository owner (always lowercased).'
        required: false
        type: string
        default: ''
      push:
        description: 'Push the image. Set false to build + scan only.'
        required: false
        type: boolean
        default: true
      fs-scan:
        description: 'Run a Trivy filesystem scan of the build context before building.'
        required: false
        type: boolean
        default: true
      image-scan:
        description: 'Run a Trivy scan of the built image before pushing.'
        required: false
        type: boolean
        default: true
      scan-ignore-unfixed:
        description: 'Ignore vulnerabilities that have no fix yet.'
        required: false
        type: boolean
        default: false
      sbom:
        description: 'Attach SBOM + provenance on release-tier pushes (default branch / tags).'
        required: false
        type: boolean
        default: true
      sign:
        description: 'Cosign keyless-sign the image on release-tier pushes.'
        required: false
        type: boolean
        default: false
      environment-tag:
        description: 'Optional extra raw tag (e.g. latest-qa) for promotion.'
        required: false
        type: string
        default: ''
      default-branch:
        description: 'Branch treated as trunk (versioning + latest tag + hardening).'
        required: false
        type: string
        default: 'main'
      runs-on:
        description: 'Runner label.'
        required: false
        type: string
        default: 'ubuntu-latest'
      fetch-depth:
        description: 'Checkout fetch depth (0 = full history, needed for versioning).'
        required: false
        type: number
        default: 0
    outputs:
      version:
        description: 'Resolved version used for tagging.'
        value: ${{ jobs.build.outputs.version }}
      image:
        description: 'Fully-qualified image reference (without tag).'
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: 'Pushed image digest (empty when not pushed).'
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push ${{ inputs.image-name }}
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.image.outputs.ref }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      # ----- Version -----
      - name: Compute version
        id: gv
        if: ${{ inputs.version == '' }}
        continue-on-error: true
        uses: gks-composite/global-version@main
        with:
          tagPrefix: v
          defaultBranch: ${{ inputs.default-branch }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"; SRC="input"
          elif [ "${{ steps.gv.outcome }}" = "success" ] && [ -n "${{ steps.gv.outputs.version }}" ]; then
            V="${{ steps.gv.outputs.version }}"; SRC="global-version"
          else
            V="0.1.${{ github.run_number }}"; SRC="fallback"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V (source: $SRC)"

      - name: Compute image reference
        id: image
        shell: bash
        run: |
          set -euo pipefail
          NS='${{ inputs.image-namespace }}'
          [ -z "$NS" ] && NS='${{ github.repository_owner }}'
          REF=$(printf '%s/%s/%s' '${{ inputs.registry }}' "$NS" '${{ inputs.image-name }}' | tr '[:upper:]' '[:lower:]')
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Image: $REF"

      # ----- Scan policy (tiered) -----
      - name: Determine scan + release policy
        id: policy
        shell: bash
        run: |
          set -euo pipefail
          RELEASE=false
          if [ "${{ github.ref }}" = "refs/heads/${{ inputs.default-branch }}" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            RELEASE=true
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SEV="CRITICAL"; EXIT="1"
          elif [ "$RELEASE" = "true" ]; then
            SEV="HIGH,CRITICAL"; EXIT="1"
          else
            SEV="HIGH,CRITICAL"; EXIT="0"
          fi
          echo "severity=$SEV" >> "$GITHUB_OUTPUT"
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          echo "release_tier=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Scan tier: severity=$SEV exit-code=$EXIT release_tier=$RELEASE"

      # ----- Source (filesystem) scan -----
      - name: Trivy filesystem scan
        if: ${{ inputs.fs-scan }}
        uses: gks-composite/trivy-scan@v1
        with:
          scan-type: fs
          scan-ref: ${{ inputs.context }}
          severity: ${{ steps.policy.outputs.severity }}
          exit-code: ${{ steps.policy.outputs.exit_code }}
          ignore-unfixed: ${{ inputs.scan-ignore-unfixed }}
          scanners: 'vuln,secret,misconfig'

      # ----- Build tooling -----
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ inputs.registry }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=raw,value=${{ inputs.environment-tag }},enable=${{ inputs.environment-tag != '' }}

      # ----- Build (single-arch, loaded for scanning) -----
      - name: Build image for scan
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          load: true
          push: false
          tags: local-scan:${{ github.run_id }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=${{ inputs.image-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image-name }}

      # ----- Image scan -----
      - name: Trivy image scan
        if: ${{ inputs.image-scan }}
        uses: gks-composite/trivy-scan@v1
        with:
          scan-type: image
          scan-ref: local-scan:${{ github.run_id }}
          severity: ${{ steps.policy.outputs.severity }}
          exit-code: ${{ steps.policy.outputs.exit_code }}
          ignore-unfixed: ${{ inputs.scan-ignore-unfixed }}
          scanners: 'vuln,secret'

      # ----- Push (real platforms, hardened on release tier) -----
      - name: Build & push image
        id: push
        if: ${{ inputs.push }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=${{ inputs.image-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image-name }}
          sbom: ${{ inputs.sbom && steps.policy.outputs.release_tier == 'true' }}
          provenance: ${{ inputs.sbom && steps.policy.outputs.release_tier == 'true' }}

      # ----- Sign (release tier, opt-in) -----
      - name: Install cosign
        if: ${{ inputs.sign && inputs.push && steps.policy.outputs.release_tier == 'true' && steps.push.outputs.digest != '' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image (keyless)
        if: ${{ inputs.sign && inputs.push && steps.policy.outputs.release_tier == 'true' && steps.push.outputs.digest != '' }}
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # ----- Summary -----
      - name: Summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Docker image: \`${{ inputs.image-name }}\`"
            echo ""
            echo "- **Image**: \`${{ steps.image.outputs.ref }}\`"
            echo "- **Version**: \`${{ steps.version.outputs.version }}\`"
            echo "- **Pushed**: \`${{ inputs.push }}\`  •  **Digest**: \`${{ steps.push.outputs.digest || 'n/a' }}\`"
            echo "- **Scan tier**: severity \`${{ steps.policy.outputs.severity }}\`, exit-code \`${{ steps.policy.outputs.exit_code }}\`"
            echo "- **Hardened (SBOM/provenance)**: \`${{ inputs.sbom && steps.policy.outputs.release_tier == 'true' }}\`"
            echo ""
            echo "### Tags"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
